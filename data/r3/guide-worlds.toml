# The hero's worlds (static/js/r3-worlds.js) and the names the guide's records use for them.
# A guide page belongs to a world when its Key locations row names a place there: the name
# followed by a comma or a space, as in "Tatooine, Sandriver" or "Tatooine Czerka Office".
# Add a spelling to `match` when the records spell a world differently.

[[worlds]]
name = "Tatooine"
slug = "tatooine"
match = ["Tatooine", "TatooineRace"]

[[worlds]]
name = "Taris"
slug = "taris"
match = ["Taris"]

