# Site configuration. This file is about the website; facts about the mod live in
# content/home/mod.toml. Zola reads this file; so does CI.

# Where the site lives. On GitHub Pages the workflow substitutes the real Pages URL, so this
# value matters for local previews and for links inside the offline documentation.
base_url = "https://DreamWeave-MP.github.io/Starwind-R3mastered"
title = "Starwind R3mastered"
description = "A modern, auditable OpenMW reconstruction and continuation of Starwind."

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
# The repository that builds and publishes this site. CI refuses to build anywhere else.
github_username = "DreamWeave-MP"
github_project = "Starwind-R3mastered"

logo_text = "Starwind R3mastered"
favicon = "img/starwind.svg"
footer_text = "Starwind R3mastered · DreamWeave & TSI contributors"

# Teal, recolored further in sass/brand.sass.
palette = "teal"

menu_items = [
    { name = "Starwind", url = "@/home/index.md" },
    { name = "Game guide", url = "@/guide/_index.md" },
    { name = "Docs", url = "@/docs/_index.md" },
    { name = "History", url = "@/docs/history/_index.md" },
]

# Oxanium everywhere, as Starwind has always been set.
font_override = "oxanium"
font_override_titles_only = false

# DreamWeave's own page-view counter: this is DreamWeave's site.
goatcounter = "dreamweave-mp"

# GitHub Discussions on this repository, through giscus. The ids are looked up at build time.
[extra.comments]
enabled = true
category = "General"
